# Build the site and publish it to GitHub Pages.
#
# The address is NOT hard-coded. `actions/configure-pages` reports where Pages
# is actually serving from, and the build is given those values:
#
#   project path   origin https://phobiadev.github.io   base /aegir-website
#   custom domain  origin https://<the domain>          base (empty)
#
# So the day a custom domain is set in Settings -> Pages, the next run rebuilds
# at the root with the right canonical URLs and nothing here changes. Both
# destinations are covered by `npm run verify:builds` on every push.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you re-run it by hand — needed after changing the custom domain,
  # since that changes the base path but touches no file.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A content save from the CMS can land while an
# earlier build is still running; the newer content should win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Everything that can say NO comes first, in its own job, so a bad content
  # save fails loudly and the live site is left exactly as it was.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      # validate -> typecheck -> test -> build all four destinations and scan
      # each output for unbased or broken URLs and leaked drafts.
      - run: npm run check

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: npm
      - run: npm ci

      - name: Work out where Pages is serving from
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          # Empty once a custom domain is in use; astro.config.mjs falls back
          # to "/" on an empty value.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # The same scan `npm run check` runs, but against the artefact that is
      # about to go live and the base it will actually be served at.
      - name: Check the built output against the real base
        run: node scripts/check-output.mjs dist "${{ steps.pages.outputs.base_path || '/' }}"

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
